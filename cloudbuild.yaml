steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/tip-of-your-tongue:$COMMIT_SHA', '.']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/tip-of-your-tongue:$COMMIT_SHA']
  - name: 'gcr.io/cloud-builders/gcloud'
    args: ['run', 'deploy', 'tip-of-your-tongue-dev', '--image', 'gcr.io/$PROJECT_ID/tip-of-your-tongue:$COMMIT_SHA', '--platform', 'managed', '--region', 'us-central1', '--allow-unauthenticated']
images:
  - 'gcr.io/$PROJECT_ID/tip-of-your-tongue:$COMMIT_SHA'
substitutions:
  _PROJECT_ID: 'tip-of-your-tongue-dev'
  _COMMIT_SHA: 'latest'